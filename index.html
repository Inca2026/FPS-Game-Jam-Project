<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Operation: Peacock Down (Top-Down Tactical)</title>
  <style>
    body {
      margin: 0; overflow: hidden; background: #1a120b;
      font-family: 'Courier New', monospace; user-select: none;
    }
    canvas { display: block; cursor: crosshair; }
    #hud {
      position: fixed; top: 15px; left: 15px; color: #00ff66;
      background: rgba(10, 15, 10, 0.85); padding: 12px 16px;
      border: 2px solid #00ff66; font-size: 14px; line-height: 1.5;
    }
    #dialogue {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      width: 75%; max-width: 760px; background: rgba(12, 18, 28, 0.94);
      color: #ffd700; border: 2px solid #ffd700; padding: 14px 20px;
      font-size: 15px; display: none; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; z-index: 10; cursor: pointer;
    }
    h1 { color: #ffd700; margin-bottom: 8px; letter-spacing: 2px; }
    button {
      margin-top: 15px; padding: 12px 28px; font-size: 16px; font-family: inherit;
      background: #ffd700; color: #111; border: none; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>OPERATION: PEACOCK DOWN</h1>
    <p>WASD / Arrow Keys to Move | Mouse to Aim | Click to Fire</p>
    <p style="color:#aaa; font-size:13px;">Infiltrate the Golden Palace, grab baklava, and neutralize Emperor Xerxes IV.</p>
    <button id="startBtn">DEPLOY GHOST-7</button>
  </div>
  <div id="hud">
    <div><strong>OPERATIVE:</strong> GHOST-7 | <strong>HP:</strong> <span id="hp">100</span>%</div>
    <div><strong>ACT:</strong> <span id="act">1 - OUTER COURTYARD</span></div>
    <div><strong>HOSTILES REMAINING:</strong> <span id="count">0</span></div>
  </div>
  <div id="dialogue"></div>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freqStart, freqEnd, type = 'sawtooth', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    const dialogueEl = document.getElementById('dialogue');
    let dialogueTimeout;
    function say(speaker, line, duration = 5500) {
      clearTimeout(dialogueTimeout);
      dialogueEl.innerHTML = `<strong>[${speaker}]:</strong> "${line}"`;
      dialogueEl.style.display = 'block';
      dialogueTimeout = setTimeout(() => { dialogueEl.style.display = 'none'; }, duration);
    }

    const WORLD_W = 1200;
    const WORLD_H = 2600;
    const player = {
      x: WORLD_W / 2, y: WORLD_H - 180, radius: 18,
      speed: 260, angle: -Math.PI / 2, hp: 100, recoil: 0
    };

    const walls = [
      { x: 0, y: 0, w: 60, h: WORLD_H },
      { x: WORLD_W - 60, y: 0, w: 60, h: WORLD_H },
      { x: 0, y: 0, w: WORLD_W, h: 60 },
      { x: 0, y: WORLD_H - 60, w: WORLD_W, h: 60 },
      { x: 60, y: 1850, w: 420, h: 45 },
      { x: 720, y: 1850, w: 420, h: 45 },
      { x: 60, y: 1150, w: 420, h: 45 },
      { x: 720, y: 1150, w: 420, h: 45 },
      { x: 60, y: 550, w: 440, h: 45 },
      { x: 700, y: 550, w: 440, h: 45 }
    ];

    const pillars = [];
    for (let y = 300; y <= 2300; y += 260) {
      pillars.push({ x: 260, y, r: 28 });
      pillars.push({ x: WORLD_W - 260, y, r: 28 });
    }

    const enemies = [];
    function addEnemy(x, y, type = 'guard') {
      enemies.push({
        x, y, type,
        radius: type === 'boss' ? 32 : 18,
        hp: type === 'boss' ? 25 : (type === 'immortal' ? 4 : 2),
        maxHp: type === 'boss' ? 25 : (type === 'immortal' ? 4 : 2),
        angle: Math.PI / 2, cooldown: Math.random() * 1.5, hitFlash: 0
      });
    }

    addEnemy(400, 2150, 'guard'); addEnemy(800, 2150, 'guard'); addEnemy(600, 1980, 'guard');
    addEnemy(350, 1600, 'immortal'); addEnemy(850, 1600, 'immortal');
    addEnemy(450, 1320, 'guard'); addEnemy(750, 1320, 'immortal');
    addEnemy(350, 920, 'immortal'); addEnemy(850, 920, 'immortal'); addEnemy(600, 740, 'immortal');
    addEnemy(WORLD_W / 2, 240, 'boss');
    const pickups = [
      { x: 180, y: 1960, collected: false },
      { x: 1020, y: 1260, collected: false },
      { x: 180, y: 660, collected: false }
    ];

    const bullets = [];
    const keys = {};
    const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    let gameRunning = false;

    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);
    document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('overlay').style.display = 'none';
      gameRunning = true;
      say("HQ", "Listen up, Ghost-7. Take out Emperor Xerxes IV—and grab any baklava trays you spot. Budget cuts hit the cafeteria hard.");
    });

    canvas.addEventListener('mousedown', () => {
      if (!gameRunning || player.hp <= 0) return;
      playSound(520, 90, 'sawtooth', 0.09);
      player.recoil = 6;
      const gunTipX = player.x + Math.cos(player.angle) * 26;
      const gunTipY = player.y + Math.sin(player.angle) * 26;
      bullets.push({
        x: gunTipX, y: gunTipY,
        vx: Math.cos(player.angle) * 780,
        vy: Math.sin(player.angle) * 780,
        fromPlayer: true, life: 1.2
      });
    });

    const triggers = [
      { y: 2180, fired: false, speaker: "PALACE GUARD", text: "Halt! Wait—is that standard-issue Kevlar? Ugh, I didn't even iron my ceremonial tunic today." },
      { y: 1780, fired: false, speaker: "HQ", text: "Entering Hall of Mirrors. Watch out for the Royal Immortals—they're grumpy because palace Wi-Fi is down." },
      { y: 1100, fired: false, speaker: "EMPEROR XERXES IV (PA)", text: "Intruder! You dare track desert sand onto my imported silk rugs?! Do you know what the dry-cleaning bill is?!" },
      { y: 520, fired: false, speaker: "EMPEROR XERXES IV", text: "Enough! Behold my Golden Peacock Exosuit! ...Wait, who forgot to charge the batteries?! Keep shooting!" }
    ];
    function drawPlayerModel(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(-2, 4, 19, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#2d3a27';
      ctx.fillRect(-18, -11, 8, 22);

      ctx.fillStyle = '#4a5d3f';
      ctx.beginPath(); ctx.ellipse(0, 0, 14, 19, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1b2416'; ctx.lineWidth = 2; ctx.stroke();

      const kick = -p.recoil;
      ctx.fillStyle = '#1f2421'; ctx.fillRect(6 + kick, 4, 24, 5);
      ctx.fillStyle = '#3a403d'; ctx.fillRect(2 + kick, 3, 12, 7);

      ctx.fillStyle = '#3b4b32';
      ctx.beginPath();
      ctx.arc(6, -11, 5, 0, Math.PI * 2);
      ctx.arc(12 + kick, 7, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#263020';
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#00ff66';
      ctx.beginPath();
      ctx.arc(9, -4, 2.5, 0, Math.PI * 2);
      ctx.arc(9, 4, 2.5, 0, Math.PI * 2);
      ctx.arc(11, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawEnemyModel(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.angle);

      if (e.type === 'boss') {
        for (let i = -3; i <= 3; i++) {
          ctx.save(); ctx.rotate(i * 0.25);
          ctx.fillStyle = i % 2 === 0 ? '#1d4e89' : '#00a896';
          ctx.beginPath(); ctx.ellipse(-26, 0, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#ffd700';
        ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#7a5c00'; ctx.lineWidth = 3; ctx.stroke();

        ctx.fillStyle = '#333';
        ctx.fillRect(10, -22, 24, 7);
        ctx.fillRect(10, 15, 24, 7);

        ctx.fillStyle = '#8b1e24';
        ctx.beginPath(); ctx.arc(2, 0, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(4, 0, 8, 0, Math.PI * 2); ctx.fill();
      } else {
        const tunicColor = e.type === 'immortal' ? '#6a1b9a' : '#1d4e89';
        ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : tunicColor;
        ctx.beginPath(); ctx.ellipse(0, 0, 13, 18, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = '#c0c0c0'; ctx.fillRect(4, 5, 22, 4);
        ctx.fillStyle = e.type === 'immortal' ? '#ffd700' : '#f4e8c1';
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      if (e.hp < e.maxHp) {
        ctx.fillStyle = '#000'; ctx.fillRect(e.x - 18, e.y - e.radius - 12, 36, 5);
        ctx.fillStyle = '#ff3333'; ctx.fillRect(e.x - 18, e.y - e.radius - 12, 36 * (e.hp / e.maxHp), 5);
      }
    }
    function circleRectCollide(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX, dy = cy - closestY;
      return (dx * dx + dy * dy) < (cr * cr);
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (gameRunning && player.hp > 0) {
        let dx = 0, dy = 0;
        if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
        if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

        const nextX = player.x + dx * player.speed * dt;
        const nextY = player.y + dy * player.speed * dt;

        let blockX = false, blockY = false;
        for (const w of walls) {
          if (circleRectCollide(nextX, player.y, player.radius, w.x, w.y, w.w, w.h)) blockX = true;
          if (circleRectCollide(player.x, nextY, player.radius, w.x, w.y, w.w, w.h)) blockY = true;
        }
        for (const p of pillars) {
          if (Math.hypot(nextX - p.x, player.y - p.y) < player.radius + p.r) blockX = true;
          if (Math.hypot(player.x - p.x, nextY - p.y) < player.radius + p.r) blockY = true;
        }
        if (!blockX) player.x = nextX;
        if (!blockY) player.y = nextY;

        if (player.recoil > 0) player.recoil = Math.max(0, player.recoil - dt * 40);

        const camX = player.x - canvas.width / 2;
        const camY = player.y - canvas.height / 2;
        player.angle = Math.atan2((mouse.y + camY) - player.y, (mouse.x + camX) - player.x);

        const actEl = document.getElementById('act');
        if (player.y > 1850) actEl.textContent = "1 - OUTER COURTYARD";
        else if (player.y > 1150) actEl.textContent = "2 - HALL OF MIRRORS";
        else if (player.y > 550) actEl.textContent = "3 - ROYAL MENAGERIE";
        else actEl.textContent = "4 - PEACOCK THRONE ROOM";

        for (const t of triggers) {
          if (!t.fired && player.y < t.y) { t.fired = true; say(t.speaker, t.text); }
        }

        for (const item of pickups) {
          if (!item.collected && Math.hypot(player.x - item.x, player.y - item.y) < 32) {
            item.collected = true;
            player.hp = Math.min(100, player.hp + 35);
            document.getElementById('hp').textContent = player.hp;
            playSound(440, 880, 'sine', 0.15);
            say("HQ", "You found pistachio baklava! +35 HP. Command is officially jealous.");
          }
        }

        for (const e of enemies) {
          if (e.hitFlash > 0) e.hitFlash -= dt;
          if (Math.hypot(player.x - e.x, player.y - e.y) < 460) {
            e.angle = Math.atan2(player.y - e.y, player.x - e.x);
            e.cooldown -= dt;
            if (e.cooldown <= 0) {
              e.cooldown = e.type === 'boss' ? 0.85 : 1.7;
              playSound(220, 80, 'square', 0.08);
              bullets.push({
                x: e.x + Math.cos(e.angle) * (e.radius + 8),
                y: e.y + Math.sin(e.angle) * (e.radius + 8),
                vx: Math.cos(e.angle) * 380, vy: Math.sin(e.angle) * 380,
                fromPlayer: false, life: 2.0
              });
            }
          }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
          let remove = b.life <= 0;
          for (const w of walls) {
            if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) remove = true;
          }
          for (const p of pillars) {
            if (Math.hypot(b.x - p.x, b.y - p.y) < p.r) remove = true;
          }

          if (!remove && b.fromPlayer) {
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius) {
                e.hp -= 1; e.hitFlash = 0.08; remove = true;
                if (e.hp <= 0) {
                  enemies.splice(j, 1);
                  if (e.type === 'boss') {
                    say("EMPEROR XERXES IV", "Nooo! My golden peacock suit wasn't even fully charged! Tell my chef... cancel the soufflé... [MISSION COMPLETE]", 10000);
                  } else {
                    const quips = ["Guard down! He was two days from retirement.", "Target neutralized. His tunic wasn't even ironed.", "Clean shot, Ghost-7. HQ approves."];
                    say("HQ", quips[Math.floor(Math.random() * quips.length)], 3200);
                  }
                }
                break;
              }
            }
          } else if (!remove && !b.fromPlayer) {
            if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
              player.hp = Math.max(0, player.hp - 12);
              document.getElementById('hp').textContent = player.hp;
              remove = true;
              if (player.hp <= 0) say("HQ", "Ghost-7 is down! Refresh the page to deploy a clone.", 10000);
            }
          }
          if (remove) bullets.splice(i, 1);
        }
      }

      document.getElementById('count').textContent = enemies.length;
      ctx.fillStyle = '#1a120b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

      ctx.fillStyle = '#d9a05b'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      ctx.strokeStyle = 'rgba(139, 90, 43, 0.25)'; ctx.lineWidth = 2;
      for (let x = 0; x < WORLD_W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); ctx.stroke(); }
      for (let y = 0; y < WORLD_H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke(); }

      ctx.fillStyle = '#8b1e24'; ctx.fillRect(WORLD_W / 2 - 90, 120, 180, WORLD_H - 240);
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 5; ctx.strokeRect(WORLD_W / 2 - 80, 130, 160, WORLD_H - 260);

      for (const item of pickups) {
        if (!item.collected) {
          ctx.fillStyle = '#ffd700'; ctx.fillRect(item.x - 14, item.y - 10, 28, 20);
          ctx.fillStyle = '#7cb342'; ctx.fillRect(item.x - 9, item.y - 6, 18, 12);
        }
      }
      for (const w of walls) {
        ctx.fillStyle = '#1d4e89'; ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.strokeRect(w.x, w.y, w.w, w.h);
      }
      for (const p of pillars) {
        ctx.fillStyle = '#1d4e89'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4; ctx.stroke();
      }

      for (const e of enemies) drawEnemyModel(e);
      drawPlayerModel(player);
      for (const b of bullets) {
        ctx.fillStyle = b.fromPlayer ? '#00ff66' : '#ff4444';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.fromPlayer ? 4 : 5, 0, Math.PI * 2); ctx.fill();
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
